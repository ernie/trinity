name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential p7zip-full

      - name: Build pk3 files
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: trinity
          path: dist/*.pk3

      - name: Download announcer pk3
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.ANNOUNCER_PAT }}
        run: |
          gh release download --repo ernie/trinity-announcer --pattern 'zzz-trinity-announcer.pk3' --dir dist || echo "No announcer release found — skipping"

      - name: Build sha256sums.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euxo pipefail
          ( cd dist && sha256sum *.pk3 > sha256sums.txt )
          cat dist/sha256sums.txt

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.pk3
            dist/sha256sums.txt
          generate_release_notes: true
          body: |
            To update, ensure your Quake 3 client isn't running, and copy:
            - `pak8t.pk3` → `baseq3`
            - `pak3t.pk3` → `missionpack`
            - `zzz-trinity-announcer.pk3` → `baseq3`

  # Canary: sync the vendored VR drop from THIS checkout over the stock-ioq3
  # reference template and build its QVMs. A Trinity-substrate dependency
  # leaking into a vendored file compiles fine here (the substrate exists)
  # and only fails against a stock tree - this job is that stock tree.
  template-canary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trinity
        uses: actions/checkout@v7
        with:
          path: trinity

      - name: Checkout the stock-ioq3 template
        uses: actions/checkout@v7
        with:
          repository: ernie/trinity-vr-mod-template
          path: template
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential p7zip-full

      - name: Sync the drop from this checkout
        run: cd template && ./sync-vr-drop.sh ../trinity

      # Non-fatal: a non-empty list means this change touched the drop and the
      # template repo needs a matching resync commit.
      - name: Report template drift
        run: cd template && git status --porcelain

      - name: Build the template QVMs
        run: cd template && make

      - name: Check the pk3s exist
        run: ls -l template/dist/zzz-vrtemplate.pk3 template/dist/zzz-vrtemplate-mp.pk3

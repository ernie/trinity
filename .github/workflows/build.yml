name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential p7zip-full

      - name: Build pk3 files
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trinity
          path: dist/*.pk3

      - name: Download announcer pk3
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.ANNOUNCER_PAT }}
        run: |
          gh release download --repo ernie/q3-announcer-tts --pattern 'zzz-trinity-announcer.pk3' --dir dist || echo "No announcer release found — skipping"

      - name: Build sha256sums.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euxo pipefail
          ( cd dist && sha256sum *.pk3 > sha256sums.txt )
          cat dist/sha256sums.txt

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pk3
            dist/sha256sums.txt
          generate_release_notes: true
          body: |
            To update, ensure your Quake 3 client isn't running, and copy:
            - `pak8t.pk3` → `baseq3`
            - `pak3t.pk3` → `missionpack`
            - `zzz-trinity-announcer.pk3` → `baseq3`
